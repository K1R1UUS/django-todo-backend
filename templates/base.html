<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Таск-трекер{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand">Таск-трекер</div>
            <nav>
                <a href="{% url 'web-task-list' %}" class="{% block nav_tasks %}{% endblock %}">Мои задачи</a>
                <a href="{% url 'web-profile' %}" class="{% block nav_profile %}{% endblock %}">Профиль</a>
            </nav>
            <div class="user-box">
                {{ request.user.username }}<br>
                <a href="/api/auth/logout/">Выйти</a>
            </div>
        </aside>
        <main class="main">
            {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
